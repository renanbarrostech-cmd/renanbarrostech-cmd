<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-labelledby="t">
<title id="t">Régua Junior → Pleno: 11 de 19; MVP do RKF Bank (frontend): 8 de 20; Assuntos de estudo praticados: 8 de 14</title>
<style>
  :root{--bg:#ffffff;--card:#f6f8fa;--borda:#d0d7de;--texto:#1f2328;--suave:#57606a;--a1:#6d28d9;--a2:#0891b2;--a3:#7c3aed}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--borda:#30363d;--texto:#e6edf3;--suave:#8b949e;--a1:#8b5cf6;--a2:#06b6d4;--a3:#a78bfa}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .tit{font-size:16px;font-weight:700;fill:var(--texto)}
  .rot{font-size:14px;fill:var(--texto)}
  .val{font-size:13px;fill:var(--suave)}
  .enche{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:enche 1.4s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes enche{to{transform:scaleX(1)}}</style>
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--a1)"/><stop offset="1" style="stop-color:var(--a2)"/></linearGradient>
</defs>
<rect width="860" height="240" rx="16" style="fill:var(--bg);stroke:var(--borda)"/>
  <text x="32" y="30" class="tit">📈 Onde estou agora</text>
  <text x="32" y="60" class="rot">Régua Junior → Pleno</text>
  <text x="828" y="60" text-anchor="end" class="val">11/19 · 58%</text>
  <rect x="32" y="72" width="796" height="14" rx="7" style="fill:var(--card);stroke:var(--borda)"/>
  <rect x="32" y="72" width="460.8" height="14" rx="7" fill="url(#g)" class="enche" style="animation-delay:0.2s"/>
  <text x="32" y="122" class="rot">MVP do RKF Bank (frontend)</text>
  <text x="828" y="122" text-anchor="end" class="val">8/20 · 40%</text>
  <rect x="32" y="134" width="796" height="14" rx="7" style="fill:var(--card);stroke:var(--borda)"/>
  <rect x="32" y="134" width="318.4" height="14" rx="7" fill="url(#g)" class="enche" style="animation-delay:0.45s"/>
  <text x="32" y="184" class="rot">Assuntos de estudo praticados</text>
  <text x="828" y="184" text-anchor="end" class="val">8/14 · 57%</text>
  <rect x="32" y="196" width="796" height="14" rx="7" style="fill:var(--card);stroke:var(--borda)"/>
  <rect x="32" y="196" width="454.9" height="14" rx="7" fill="url(#g)" class="enche" style="animation-delay:0.7s"/>
</svg>
