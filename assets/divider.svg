<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 8" width="1280" height="8" fill="none" role="presentation">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="18%" stop-color="#8B5CF6" stop-opacity=".7"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity=".9"/>
      <stop offset="82%" stop-color="#06B6D4" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <mask id="line"><rect x="0" y="3" width="1280" height="2" rx="1" fill="url(#d)"/></mask>
  </defs>
  <style>
    .glide { animation: glide 5.5s cubic-bezier(.55,0,.3,1) infinite; }
    @keyframes glide { 0% { transform: translateX(-260px) } 65%,100% { transform: translateX(1320px) } }
  </style>
  <rect x="0" y="3" width="1280" height="2" rx="1" fill="url(#d)"/>
  <g mask="url(#line)"><rect class="glide" x="0" y="3" width="240" height="2" fill="url(#spark)"/></g>
</svg>
