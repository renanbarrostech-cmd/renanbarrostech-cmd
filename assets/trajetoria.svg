    <circle cx="745" cy="130" r="4" style="fill:var(--a1)"/>
    <text x="745" y="172" text-anchor="middle" class="ano">agora</text>
    <text x="745" y="194" text-anchor="middle" class="tit">Rumo ao Pleno</text>
