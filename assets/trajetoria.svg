    <circle cx="241" cy="130" r="4" style="fill:var(--a1)"/>
    <text x="241" y="172" text-anchor="middle" class="ano">2024</text>
    <text x="241" y="194" text-anchor="middle" class="tit">Graduação em GTI</text>
    <text x="241" y="212" text-anchor="middle" class="desc">Estácio · e mais duas promoções</text>
  </g>
  <g class="marco" style="animation-delay:1s">
    <circle cx="367" cy="130" r="9" stroke="url(#g)" stroke-width="3" style="fill:var(--bg)"/>
    <circle cx="367" cy="130" r="4" style="fill:var(--a1)"/>
    <text x="367" y="92" text-anchor="middle" class="ano">2025</text>
    <text x="367" y="70" text-anchor="middle" class="tit">Full Stack Club</text>
    <text x="367" y="52" text-anchor="middle" class="desc">React, Node e projetos do zero ao deploy</text>
  </g>
  <g class="marco" style="animation-delay:1.3499999999999999s">
    <circle cx="493" cy="130" r="9" stroke="url(#g)" stroke-width="3" style="fill:var(--bg)"/>
    <circle cx="493" cy="130" r="4" style="fill:var(--a1)"/>
    <text x="493" y="172" text-anchor="middle" class="ano">03/2026</text>
    <text x="493" y="194" text-anchor="middle" class="tit">Formação DevClub</text>
    <text x="493" y="212" text-anchor="middle" class="desc">140 h · certificado MEC</text>
  </g>
  <g class="marco" style="animation-delay:1.7s">
    <circle cx="619" cy="130" r="9" stroke="url(#g)" stroke-width="3" style="fill:var(--bg)"/>
    <circle cx="619" cy="130" r="4" style="fill:var(--a1)"/>
