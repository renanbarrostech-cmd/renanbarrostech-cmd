<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Trajetória: 2023 Primeiro emprego, 2024 Graduação em GTI, 2025 Full Stack Club, 03/2026 Formação DevClub, 09/2026 RKF Bank, agora Rumo ao Pleno</title>
<style>
  :root{--bg:#ffffff;--card:#f6f8fa;--borda:#d0d7de;--texto:#1f2328;--suave:#57606a;--a1:#6d28d9;--a2:#0891b2;--a3:#7c3aed}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--borda:#30363d;--texto:#e6edf3;--suave:#8b949e;--a1:#8b5cf6;--a2:#06b6d4;--a3:#a78bfa}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .ano{font-size:13px;font-weight:700;fill:var(--a1)}
  .tit{font-size:14px;font-weight:700;fill:var(--texto)}
  .desc{font-size:11px;fill:var(--suave)}
  .linha{stroke-dasharray:640;stroke-dashoffset:640;animation:risca 2.4s ease-out forwards}
  .marco{opacity:0;animation:aparece .6s ease-out forwards}
  @keyframes risca{to{stroke-dashoffset:0}}
  @keyframes aparece{to{opacity:1}}</style>
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--a1)"/><stop offset="1" style="stop-color:var(--a2)"/></linearGradient>
</defs>
<rect width="860" height="240" rx="16" style="fill:var(--bg);stroke:var(--borda)"/>
  <line x1="115" y1="130" x2="745" y2="130" stroke-width="4" stroke-linecap="round" style="stroke:var(--borda)"/>
  <line x1="115" y1="130" x2="745" y2="130" stroke="url(#g)" stroke-width="4" stroke-linecap="round" class="linha"/>
  <g class="marco" style="animation-delay:0.3s">
    <circle cx="115" cy="130" r="9" stroke="url(#g)" stroke-width="3" style="fill:var(--bg)"/>
    <circle cx="115" cy="130" r="4" style="fill:var(--a1)"/>
    <text x="115" y="92" text-anchor="middle" class="ano">2023</text>
