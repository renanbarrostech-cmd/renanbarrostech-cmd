<g class="ln" style="animation-delay:3.00s"><text x="28" y="184" class="mono"><tspan class="h">ab74b95</tspan> <tspan class="m">feat: adiciona sistema de logging no frontend</tspan></text></g>
<g class="ln" style="animation-delay:3.35s"><text x="28" y="206" class="mono"><tspan class="h">23f2fb9</tspan> <tspan class="m">docs: adicionando checklist no roadmap e adicionando uma decisão</tspan></text></g>
