<svg xmlns="http://www.w3.org/2000/svg" width="317" height="40" viewBox="0 0 317 40" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Também estou mudando de carreira</title>
<style>
  :root{--bg:#ffffff;--card:#f6f8fa;--borda:#d0d7de;--texto:#1f2328;--suave:#57606a;--a1:#6d28d9;--a2:#0891b2;--a3:#7c3aed}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--borda:#30363d;--texto:#e6edf3;--suave:#8b949e;--a1:#8b5cf6;--a2:#06b6d4;--a3:#a78bfa}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .b{fill:var(--card);stroke:var(--borda)}
  .d{fill:url(#g)}
  .tx{font-size:14px;font-weight:600;fill:var(--texto)}
  .anel{fill:none;stroke:url(#g);stroke-width:1.5;opacity:.0;animation:pulsa 3s ease-in-out infinite}
  @keyframes pulsa{50%{opacity:.9}}</style>
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--a1)"/><stop offset="1" style="stop-color:var(--a2)"/></linearGradient>
</defs>

<rect x="1" y="1" width="315" height="38" rx="10" class="b"/>
<rect x="1" y="1" width="315" height="38" rx="10" class="anel"/>
<text x="158.5" y="25" text-anchor="middle" class="tx">🌱 Também estou mudando de carreira</text>
</svg>
