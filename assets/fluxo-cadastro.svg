  <line x1="83" y1="152" x2="83" y2="176" class="desce"/><line x1="221" y1="152" x2="221" y2="176" class="desce"/><line x1="359" y1="152" x2="359" y2="176" class="desce"/><line x1="497" y1="152" x2="497" y2="176" class="desce"/><line x1="635" y1="152" x2="635" y2="176" class="desce"/><line x1="773" y1="152" x2="773" y2="176" class="desce"/>
  <circle r="7" class="pacote"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear" path="M83,176 L773,176"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="6s" repeatCount="indefinite"/></circle>
  <circle r="7" class="volta"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="1;1;0" keyTimes="0;0.5;1" calcMode="linear" path="M83,176 L773,176"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.51;1" dur="6s" repeatCount="indefinite"/></circle>
