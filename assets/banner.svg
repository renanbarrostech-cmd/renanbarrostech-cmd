<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Renan Barros, desenvolvedor Full Stack. 19 repositórios públicos, 17 commits no RKF Bank, 11/19 régua Pleno, 8 assuntos praticados</title>
<style>
  :root{--bg:#ffffff;--card:#f6f8fa;--borda:#d0d7de;--texto:#1f2328;--suave:#57606a;--a1:#6d28d9;--a2:#0891b2;--a3:#7c3aed}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--borda:#30363d;--texto:#e6edf3;--suave:#8b949e;--a1:#8b5cf6;--a2:#06b6d4;--a3:#a78bfa}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .nome{font-size:44px;font-weight:800;fill:url(#g)}
  .sub{font-size:17px;fill:var(--suave)}
  .tag{font-size:13px;fill:var(--a1);font-weight:600}
  .num{font-size:28px;font-weight:800;fill:var(--texto)}
  .rot{font-size:12.5px;fill:var(--suave)}
  .card{opacity:0;animation:sobe .7s ease-out forwards}
  .brilho{animation:brilho 6s linear infinite}
  .cursor{animation:pisca 1s steps(1) infinite}
  @keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
  @keyframes brilho{from{transform:translateX(-300px)}to{transform:translateX(1160px)}}
  @keyframes pisca{50%{opacity:0}}</style>
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--a1)"/><stop offset="1" style="stop-color:var(--a2)"/></linearGradient>
</defs>

<rect width="860" height="290" rx="18" style="fill:var(--bg);stroke:var(--borda)"/>
<rect class="brilho" x="0" y="0" width="160" height="4" rx="2" fill="url(#g)"/>
<text x="40" y="58" class="tag mono">~/renan $ whoami<tspan class="cursor">▌</tspan></text>
<text x="40" y="112" class="nome">Renan Barros</text>
<text x="40" y="146" class="sub">Desenvolvedor Full Stack · Next.js · TypeScript · Node.js · Junior → Pleno</text>

  <g class="card" style="animation-delay:0.25s" transform="translate(40,178)">
    <rect width="180" height="78" rx="12" style="fill:var(--card);stroke:var(--borda)"/>
    <text x="90" y="38" text-anchor="middle" class="num">19</text>
    <text x="90" y="60" text-anchor="middle" class="rot">repositórios públicos</text>
  </g>
  <g class="card" style="animation-delay:0.4s" transform="translate(240,178)">
    <rect width="180" height="78" rx="12" style="fill:var(--card);stroke:var(--borda)"/>
    <text x="90" y="38" text-anchor="middle" class="num">17</text>
    <text x="90" y="60" text-anchor="middle" class="rot">commits no RKF Bank</text>
  </g>
  <g class="card" style="animation-delay:0.55s" transform="translate(440,178)">
    <rect width="180" height="78" rx="12" style="fill:var(--card);stroke:var(--borda)"/>
    <text x="90" y="38" text-anchor="middle" class="num">11/19</text>
    <text x="90" y="60" text-anchor="middle" class="rot">régua Pleno</text>
  </g>
  <g class="card" style="animation-delay:0.7s" transform="translate(640,178)">
    <rect width="180" height="78" rx="12" style="fill:var(--card);stroke:var(--borda)"/>
    <text x="90" y="38" text-anchor="middle" class="num">8</text>
    <text x="90" y="60" text-anchor="middle" class="rot">assuntos praticados</text>
  </g>
</svg>
